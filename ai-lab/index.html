<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open-Source AI Lab</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
<header class="topbar">
<div><h1>🆓 Open-Source AI Lab</h1><p>Run open models locally — no paid API and no trial account.</p></div>
<a href="../OPEN_SOURCE_AI_MODELS.md" target="_blank">Model Directory ↗</a>
</header>
<main class="layout">
<aside class="sidebar">
<label>Runtime</label>
<select id="runtime"><option value="ollama">Ollama Local</option><option value="huggingface">Hugging Face Local</option></select>
<label>Model</label>
<div class="row"><select id="model"></select><button id="refresh">↻</button></div>
<input id="hfModel" class="hidden" placeholder="Hugging Face model ID">
<label>Task</label>
<select id="task"><option value="chat">Chat</option><option value="explain">Explain</option><option value="summarize">Summarize</option><option value="rewrite">Rewrite</option><option value="code">Coding</option></select>
<label>Temperature</label>
<input id="temperature" type="range" min="0" max="1.5" step="0.1" value="0.7"><span id="tempValue">0.7</span>
<button id="clear" class="secondary">Clear chat</button>
<div id="status" class="status">Checking local runtime…</div>
</aside>
<section class="chat">
<div id="messages" class="messages"><div class="welcome"><h2>Choose a local model and start.</h2><p>Ollama is the easiest path. Hugging Face Local can load supported text-generation models directly on your PC.</p></div></div>
<form id="chatForm" class="composer"><textarea id="prompt" rows="3" placeholder="Ask the model to do something…"></textarea><button type="submit" id="send">Send</button></form>
</section>
</main>
</div>
<script src="./app.js"></script>
</body>
</html>
